<template id="task-bar">
  <style>:host { display: none; }</style>
  <div class="bar">
    <div class="start">
      <pin-button appearance="flat"></pin-button>
    </div>
    <div class="center"><slot></slot></div>
    <div class="end">
      <minimize-button appearance="flat"></minimize-button>
      <maximize-button appearance="flat"></maximize-button>
      <restore-button appearance="flat"></restore-button>
      <close-button appearance="flat"></close-button>
    </div>
  </div>
</template>
